name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  # Job 1: Lint & Build
  test:
    runs-on: ubuntu-latest
    name: Lint & Build

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/demoday_test
      BETTER_AUTH_SECRET: test-secret-for-ci-at-least-32-characters-long
      BETTER_AUTH_URL: http://localhost:3000
      EMAIL_USER: demoday.test@gmail.com
      EMAIL_PASS: test-password
      NODE_ENV: test
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      SKIP_ENV_VALIDATION: "true"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.11.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linting
        run: npm run lint

      - name: Build application
        run: npm run build

  # Job 2: E2E Tests with Docker
  e2e:
    runs-on: ubuntu-latest
    name: E2E Tests
    needs: test

    services:
      postgres:
        image: postgres:16.3-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: demoday_e2e_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/demoday_e2e_test
      BETTER_AUTH_SECRET: e2e-test-secret-at-least-32-characters-long
      BETTER_AUTH_URL: http://localhost:3000
      EMAIL_USER: demoday.test@gmail.com
      EMAIL_PASS: test-password
      NODE_ENV: production
      PORT: "3000"
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      SKIP_ENV_VALIDATION: "true"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.11.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application for E2E
        run: npm run build

      - name: Setup database
        run: |
          npm run db:push
          npx tsx scripts/seed-test-user.ts
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/demoday_e2e_test

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Kill any existing process on port 3000
        run: |
          sudo lsof -ti:3000 | xargs -r sudo kill -9 || true

      - name: Start application
        run: |
          npm run start &
          echo $! > app.pid
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/demoday_e2e_test

      - name: Wait for application to be ready
        run: |
          timeout 60s bash -c 'until curl -f http://localhost:3000; do sleep 2; done'

      - name: Run E2E tests
        run: npx playwright test --reporter=github
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/demoday_e2e_test
          CI: "true"

      - name: Stop application
        run: |
          if [ -f app.pid ]; then
            kill $(cat app.pid) || true
          fi

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30